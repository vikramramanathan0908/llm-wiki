<!DOCTYPE html>
<html>
<head>
<title>LLM Knowledge Wiki — Graph</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  body { margin: 0; background: #0e1117; color: white; font-family: sans-serif; }
  #graph { width: 100vw; height: 100vh; }
  #legend { position: fixed; top: 16px; left: 16px; background: rgba(0,0,0,0.7); padding: 12px 16px; border-radius: 8px; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; }
</style>
</head>
<body>
<div id="legend">
  <b>🧠 LLM Knowledge Wiki</b><br><br>
  <span class="dot" style="background:#4f8ef7"></span>Cognee<br>
  <span class="dot" style="background:#e63946"></span>Redis<br>
  <span class="dot" style="background:#2ec4b6"></span>Other
</div>
<div id="graph"></div>
<script>
const data = {"nodes": [{"id": "Cognee/architecture.md", "label": "architecture", "color": "#4f8ef7", "group": "Cognee"}, {"id": "Cognee/remember.md", "label": "remember", "color": "#4f8ef7", "group": "Cognee"}, {"id": "Cognee/quickstart.md", "label": "quickstart", "color": "#4f8ef7", "group": "Cognee"}, {"id": "Cognee/introduction.md", "label": "introduction", "color": "#4f8ef7", "group": "Cognee"}, {"id": "Cognee/recall.md", "label": "recall", "color": "#4f8ef7", "group": "Cognee"}, {"id": "Cognee/python-api.md", "label": "python-api", "color": "#4f8ef7", "group": "Cognee"}, {"id": "Cognee/vector-stores.md", "label": "vector-stores", "color": "#4f8ef7", "group": "Cognee"}, {"id": "Cognee/core-concepts.md", "label": "core-concepts", "color": "#4f8ef7", "group": "Cognee"}, {"id": "Cognee/api-reference.md", "label": "api-reference", "color": "#4f8ef7", "group": "Cognee"}, {"id": "Redis/redisvl-use-cases.md", "label": "redisvl-use-cases", "color": "#e63946", "group": "Redis"}, {"id": "Redis/redisvl-concepts.md", "label": "redisvl-concepts", "color": "#e63946", "group": "Redis"}, {"id": "Redis/redisvl-install.md", "label": "redisvl-install", "color": "#e63946", "group": "Redis"}, {"id": "Redis/session-cache.md", "label": "session-cache", "color": "#e63946", "group": "Redis"}, {"id": "Redis/redisvl-how-to.md", "label": "redisvl-how-to", "color": "#e63946", "group": "Redis"}, {"id": "Redis/redisvl-getting-started.md", "label": "redisvl-getting-started", "color": "#e63946", "group": "Redis"}, {"id": "Redis/when-to-choose.md", "label": "when-to-choose", "color": "#e63946", "group": "Redis"}, {"id": "Redis/redisvl-intro.md", "label": "redisvl-intro", "color": "#e63946", "group": "Redis"}], "edges": [{"from": "Cognee/architecture.md", "to": "Cognee/recall.md"}, {"from": "Cognee/architecture.md", "to": "Cognee/core-concepts.md"}, {"from": "Cognee/remember.md", "to": "Redis/session-cache.md"}, {"from": "Cognee/quickstart.md", "to": "Cognee/remember.md"}, {"from": "Cognee/quickstart.md", "to": "Cognee/recall.md"}, {"from": "Cognee/quickstart.md", "to": "Cognee/core-concepts.md"}, {"from": "Cognee/introduction.md", "to": "Cognee/remember.md"}, {"from": "Cognee/introduction.md", "to": "Cognee/quickstart.md"}, {"from": "Cognee/introduction.md", "to": "Cognee/recall.md"}, {"from": "Cognee/introduction.md", "to": "Cognee/core-concepts.md"}, {"from": "Cognee/recall.md", "to": "Redis/session-cache.md"}, {"from": "Cognee/python-api.md", "to": "Cognee/remember.md"}, {"from": "Cognee/python-api.md", "to": "Cognee/recall.md"}, {"from": "Cognee/vector-stores.md", "to": "Cognee/architecture.md"}, {"from": "Cognee/core-concepts.md", "to": "Cognee/remember.md"}, {"from": "Cognee/core-concepts.md", "to": "Cognee/recall.md"}, {"from": "Cognee/api-reference.md", "to": "Cognee/introduction.md"}, {"from": "Redis/redisvl-concepts.md", "to": "Cognee/architecture.md"}, {"from": "Redis/session-cache.md", "to": "Cognee/architecture.md"}, {"from": "Redis/when-to-choose.md", "to": "Cognee/architecture.md"}, {"from": "Redis/redisvl-intro.md", "to": "Cognee/architecture.md"}]};
const nodes = new vis.DataSet(data.nodes.map(n => ({
  id: n.id, label: n.label, color: { background: n.color, border: n.color },
  font: { color: '#ffffff', size: 14 },
  shape: 'dot', size: 18
})));
const edges = new vis.DataSet(data.edges.map(e => ({
  from: e.from, to: e.to, color: { color: '#555' }, arrows: 'to'
})));
const container = document.getElementById('graph');
const network = new vis.Network(container, { nodes, edges }, {
  physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
  interaction: { hover: true, tooltipDelay: 100 },
  edges: { smooth: { type: 'dynamic' } }
});
</script>
</body>
</html>
